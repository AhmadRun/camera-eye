[package]
name = "camera-eye-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
dotenvy = "0.15.7"
flate2 = "1.1.10"
futures-util = "0.3.34"
getrandom = "0.4.3"
http = "1.5.0"
icu_collator = "2.3.1"
indexmap = "2.14.2"
moka = { version = "0.12.16", features = ["future"] }
once_cell = "1.21.4"
parking_lot = "0.12.5"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots", "json", "stream", "gzip", "brotli", "deflate", "http2"] }
ryu-js = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }
serde_urlencoded = "0.7.1"
sgp4 = "2.4.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "set-header", "trace", "compression-gzip", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
