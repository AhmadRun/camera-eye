[package]
name = "camera-eye-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
dotenvy = "0.15.7"
flate2 = "1.1.10"
futures-util = "0.3.34"
getrandom = "0.4.3"
grib = { version = "0.20.1", default-features = false, features = ["ccsds-unpack-with-rust-aec", "jpeg2000-unpack-with-hayro", "png-unpack-with-png-crate"] }
http = "1.5.0"
icu_collator = "2.4.0"
indexmap = "2.14.2"
moka = { version = "0.12.16", features = ["future"] }
once_cell = "1.21.4"
parking_lot = "0.13.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "form", "stream", "gzip", "brotli", "deflate", "http2", "system-proxy"] }
ryu-js = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }
serde_urlencoded = "0.7.1"
sgp4 = "2.4.0"
sha1 = "0.11"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "set-header", "trace", "compression-gzip", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.26"
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4"] }
